<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB84D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- Orange accent bar -->
  <rect x="0" y="0" width="6" height="200" fill="url(#accentGrad)" rx="3"/>

  <!-- AWS logo area - orange hexagon icon -->
  <g transform="translate(60, 100)">
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="#FF9900" opacity="0.15"/>
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.6"/>
    <!-- Headset icon -->
    <g fill="#FF9900" filter="url(#glow)">
      <path d="M-10,-8 Q-10,-18 0,-18 Q10,-18 10,-8 L10,-2 Q10,2 6,2 L4,2 L4,-8 Q4,-14 0,-14 Q-4,-14 -4,-8 L-4,2 L-6,2 Q-10,2 -10,-2 Z" opacity="0.9"/>
      <rect x="-12" y="-4" width="5" height="10" rx="2.5" opacity="0.9"/>
      <rect x="7" y="-4" width="5" height="10" rx="2.5" opacity="0.9"/>
      <path d="M-4,6 Q-4,10 0,10 Q4,10 4,6" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.9"/>
    </g>
  </g>

  <!-- Main title -->
  <text x="120" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff" filter="url(#glow)">Amazon Connect Lab</text>

  <!-- Subtitle -->
  <text x="122" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a8c4e0" font-weight="400">Desafío práctico — Conecta Company · LATAM</text>

  <!-- Tags row -->
  <g transform="translate(122, 140)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#FF9900" opacity="0.15"/>
    <rect x="0" y="0" width="110" height="26" rx="13" fill="none" stroke="#FF9900" stroke-width="1" opacity="0.5"/>
    <text x="55" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FF9900" text-anchor="middle" font-weight="600">🎧 Amazon Connect</text>

    <!-- Tag 2 -->
    <rect x="120" y="0" width="80" height="26" rx="13" fill="#00a86b" opacity="0.15"/>
    <rect x="120" y="0" width="80" height="26" rx="13" fill="none" stroke="#00a86b" stroke-width="1" opacity="0.5"/>
    <text x="160" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#00a86b" text-anchor="middle" font-weight="600">✅ Inicial</text>

    <!-- Tag 3 -->
    <rect x="210" y="0" width="80" height="26" rx="13" fill="#4a9eff" opacity="0.15"/>
    <rect x="210" y="0" width="80" height="26" rx="13" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.5"/>
    <text x="250" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4a9eff" text-anchor="middle" font-weight="600">⏱ ~4 horas</text>

    <!-- Tag 4 -->
    <rect x="300" y="0" width="100" height="26" rx="13" fill="#a855f7" opacity="0.15"/>
    <rect x="300" y="0" width="100" height="26" rx="13" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <text x="350" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="600">💰 Por uso</text>
  </g>

  <!-- Right side: 4 modules indicator -->
  <g transform="translate(720, 60)">
    <text x="80" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a8c4e0" text-anchor="middle" opacity="0.7">4 MÓDULOS</text>
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#FF9900" opacity="0.9"/>
      <text x="14" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#0d1b2a" text-anchor="middle" font-weight="700">1</text>
    </g>
    <g transform="translate(56, 15)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#FF9900" opacity="0.7"/>
      <text x="14" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#0d1b2a" text-anchor="middle" font-weight="700">2</text>
    </g>
    <g transform="translate(20, 51)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#FF9900" opacity="0.5"/>
      <text x="14" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#0d1b2a" text-anchor="middle" font-weight="700">3</text>
    </g>
    <g transform="translate(56, 51)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#FF9900" opacity="0.3"/>
      <text x="14" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
    </g>
  </g>
</svg>

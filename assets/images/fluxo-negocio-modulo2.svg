<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title"><title id="title">Requisito de negocio — Conecta Company</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="1500" height="760" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#1e293b"><text x="750" y="32" text-anchor="middle" font-size="22">Conecta Company — Flujo de atención por chat</text><rect x="30" y="75" width="290" height="70" rx="8" fill="white" stroke="#1a73e8" stroke-width="1.5"/><text x="175" y="105" text-anchor="middle" font-size="14">Espera sin respuesta: 1 minuto</text><text x="175" y="125" text-anchor="middle" font-size="14">Hasta 2 repeticiones si no se entiende</text><rect x="30" y="300" width="160" height="70" rx="8" fill="white" stroke="#1a73e8" stroke-width="1.5"/><text x="110" y="330" text-anchor="middle" font-size="14">Cliente</text><text x="110" y="350" text-anchor="middle" font-size="14">Web Chat</text><rect x="230" y="285" width="270" height="100" rx="8" fill="white" stroke="#1a73e8" stroke-width="1.5"/><text x="365" y="330" text-anchor="middle" font-size="14">¡Bienvenido a Conecta Company!</text><text x="365" y="350" text-anchor="middle" font-size="14">Cuéntanos cómo podemos ayudarte.</text><rect x="550" y="240" width="270" height="190" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="685" y="280" text-anchor="middle" font-size="14">Menú principal</text><text x="685" y="300" text-anchor="middle" font-size="14">1. Inscripciones</text><text x="685" y="320" text-anchor="middle" font-size="14">2. Cursos y capacitaciones</text><text x="685" y="340" text-anchor="middle" font-size="14">3. Soporte técnico</text><text x="685" y="360" text-anchor="middle" font-size="14">4. Información financiera</text><text x="685" y="380" text-anchor="middle" font-size="14">5. Equipo comercial</text><text x="685" y="400" text-anchor="middle" font-size="14">6. Hablar con un agente</text><path d="M190 335 H230" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M500 335 H550" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M820 335 H865 M865 105 V680" stroke="#64748b" fill="none"/><path d="M865 105 H900" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="65" width="380" height="80" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="1090" y="100" text-anchor="middle" font-size="13">1. Inscripciones</text><text x="1090" y="120" text-anchor="middle" font-size="13">Cursos disponibles / proceso de inscripción</text><path d="M1280 105 H1340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="1340" y="75" width="130" height="60" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="1405" y="100" text-anchor="middle" font-size="13">Cola básica</text><text x="1405" y="120" text-anchor="middle" font-size="13">BasicQueue</text><path d="M865 220 H900" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="180" width="380" height="80" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="1090" y="215" text-anchor="middle" font-size="13">2. Cursos y capacitaciones</text><text x="1090" y="235" text-anchor="middle" font-size="13">Duración y contenido / certificados y finalización</text><path d="M1280 220 H1340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="1340" y="190" width="130" height="60" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="1405" y="215" text-anchor="middle" font-size="13">Cola básica</text><text x="1405" y="235" text-anchor="middle" font-size="13">BasicQueue</text><path d="M865 335 H900" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="295" width="380" height="80" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="1090" y="330" text-anchor="middle" font-size="13">3. Soporte técnico</text><text x="1090" y="350" text-anchor="middle" font-size="13">Espera mientras te transferimos al equipo.</text><path d="M1280 335 H1340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="1340" y="305" width="130" height="60" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="1405" y="330" text-anchor="middle" font-size="13">Cola básica</text><text x="1405" y="350" text-anchor="middle" font-size="13">BasicQueue</text><path d="M865 450 H900" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="410" width="380" height="80" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="1090" y="445" text-anchor="middle" font-size="13">4. Información financiera</text><text x="1090" y="465" text-anchor="middle" font-size="13">Atención humana directa</text><path d="M1280 450 H1340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="1340" y="420" width="130" height="60" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="1405" y="445" text-anchor="middle" font-size="13">Cola básica</text><text x="1405" y="465" text-anchor="middle" font-size="13">BasicQueue</text><path d="M865 565 H900" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="525" width="380" height="80" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="1090" y="560" text-anchor="middle" font-size="13">5. Equipo comercial</text><text x="1090" y="580" text-anchor="middle" font-size="13">Atención humana directa</text><path d="M1280 565 H1340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="1340" y="535" width="130" height="60" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="1405" y="560" text-anchor="middle" font-size="13">Cola básica</text><text x="1405" y="580" text-anchor="middle" font-size="13">BasicQueue</text><path d="M865 680 H900" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="640" width="380" height="80" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="1090" y="675" text-anchor="middle" font-size="13">6. Hablar con un agente</text><text x="1090" y="695" text-anchor="middle" font-size="13">Atención humana directa</text><path d="M1280 680 H1340" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="1340" y="650" width="130" height="60" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="1405" y="675" text-anchor="middle" font-size="13">Cola básica</text><text x="1405" y="695" text-anchor="middle" font-size="13">BasicQueue</text><text x="415" y="490" text-anchor="middle" font-size="14">Las opciones 1 y 2 presentan un submenú.</text><text x="415" y="515" text-anchor="middle" font-size="14">Las opciones 3–6 llevan directamente a atención humana.</text><text x="415" y="540" text-anchor="middle" font-size="14">Usa lenguaje natural en español LATAM.</text><text x="415" y="565" text-anchor="middle" font-size="14">Los números identifican opciones; no exigen DTMF.</text></g></svg>

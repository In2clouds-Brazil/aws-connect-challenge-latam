<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title"><title id="title">Contact Flow: esquema conceptual con Amazon Lex V2</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><rect width="900" height="660" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#1e293b"><text x="450" y="30" text-anchor="middle" font-size="21">Contact Flow: esquema conceptual</text><rect x="335" y="60" width="230" height="45" rx="8" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="450" y="87.5" text-anchor="middle" font-size="14">Entry point</text><path d="M450 105 V130" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="270" y="130" width="360" height="65" rx="8" fill="white" stroke="#1a73e8" stroke-width="1.5"/><text x="450" y="157.5" text-anchor="middle" font-size="14">Play prompt</text><text x="450" y="177.5" text-anchor="middle" font-size="14">¡Bienvenido a Conecta Company!</text><path d="M450 195 V225" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="245" y="225" width="410" height="75" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="257.5" text-anchor="middle" font-size="14">Get customer input + Amazon Lex V2</text><text x="450" y="277.5" text-anchor="middle" font-size="14">Identifica la intención en español (es_419)</text><path d="M335 300 V330 H170 V350" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M450 300 V350" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M565 300 V330 H730 V350" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="35" y="350" width="270" height="90" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/><text x="170" y="380" text-anchor="middle" font-size="13">Inscripciones / cursos</text><text x="170" y="400" text-anchor="middle" font-size="13">Submenús según el negocio</text><text x="170" y="420" text-anchor="middle" font-size="13">Intents específicas</text><rect x="325" y="350" width="250" height="90" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="450" y="380" text-anchor="middle" font-size="13">Soporte / finanzas / comercial</text><text x="450" y="400" text-anchor="middle" font-size="13">Hablar con un agente</text><text x="450" y="420" text-anchor="middle" font-size="13">Atención directa</text><rect x="605" y="350" width="250" height="90" rx="8" fill="white" stroke="#ef4444" stroke-width="1.5"/><text x="730" y="380" text-anchor="middle" font-size="13">Timeout / Default / Error</text><text x="730" y="400" text-anchor="middle" font-size="13">1 minuto sin respuesta</text><text x="730" y="420" text-anchor="middle" font-size="13">Hasta 2 repeticiones</text><path d="M170 440 V470 H330 V490" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M450 440 V470 H330 V490" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="155" y="490" width="350" height="65" rx="8" fill="white" stroke="#00a86b" stroke-width="1.5"/><text x="330" y="517.5" text-anchor="middle" font-size="14">Cola de atención → agente (CCP)</text><text x="330" y="537.5" text-anchor="middle" font-size="14">Canal Chat habilitado</text><path d="M730 440 V490" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="600" y="490" width="260" height="65" rx="8" fill="white" stroke="#ef4444" stroke-width="1.5"/><text x="730" y="517.5" text-anchor="middle" font-size="13">Diseña una salida controlada</text><text x="730" y="537.5" text-anchor="middle" font-size="13">al agotar los intentos.</text><text x="450" y="600" text-anchor="middle" font-size="14">Este esquema resume el requisito; no es un flujo importable ni una solución completa.</text><text x="450" y="625" text-anchor="middle" font-size="14">Diseña y prueba todos los caminos, los submenús y las salidas de error.</text></g></svg>

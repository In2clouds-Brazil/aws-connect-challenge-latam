<svg width="860" height="130" viewBox="0 0 860 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cbd5e1"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <rect width="860" height="130" fill="url(#bg)" rx="10"/>
  <rect width="860" height="130" fill="none" stroke="#e2e8f0" stroke-width="1" rx="10"/>

  <!-- Module 1 -->
  <g transform="translate(30, 20)" filter="url(#sh)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="6" rx="10" fill="#FF9900"/>
    <rect x="0" y="3" width="170" height="3" fill="#FF9900"/>
    <text x="85" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" text-anchor="middle">🏗️</text>
    <text x="85" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Módulo 1</text>
    <text x="85" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Frontend + sitio S3</text>
    <text x="85" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#FF9900" text-anchor="middle">~60 min</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="203" y1="65" x2="228" y2="65" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Module 2 -->
  <g transform="translate(230, 20)" filter="url(#sh)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="6" rx="10" fill="#7c3aed"/>
    <rect x="0" y="3" width="170" height="3" fill="#7c3aed"/>
    <text x="85" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" text-anchor="middle">🔀</text>
    <text x="85" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Módulo 2</text>
    <text x="85" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Connect + widget</text>
    <text x="85" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle">~60 min</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="403" y1="65" x2="428" y2="65" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Module 3 -->
  <g transform="translate(430, 20)" filter="url(#sh)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="6" rx="10" fill="#1a73e8"/>
    <rect x="0" y="3" width="170" height="3" fill="#1a73e8"/>
    <text x="85" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" text-anchor="middle">💬</text>
    <text x="85" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Módulo 3</text>
    <text x="85" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Contact Flow + Lex V2</text>
    <text x="85" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#1a73e8" text-anchor="middle">~60 min</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="603" y1="65" x2="628" y2="65" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Module 4 -->
  <g transform="translate(630, 20)" filter="url(#sh)">
    <rect x="0" y="0" width="170" height="90" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="6" rx="10" fill="#00a86b"/>
    <rect x="0" y="3" width="170" height="3" fill="#00a86b"/>
    <text x="85" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="22" text-anchor="middle">📊</text>
    <text x="85" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">Módulo 4</text>
    <text x="85" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Pruebas + métricas</text>
    <text x="85" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#00a86b" text-anchor="middle">~60 min</text>
  </g>
</svg>
